
<div class="min-h-screen bg-gradient-to-br from-gray-950 via-black to-gray-900 flex items-center justify-center p-4 relative overflow-hidden">
  
  
  <div class="absolute inset-0">
    
    <div class="absolute inset-0 bg-grid opacity-5"></div>
    
    
    <div #particlesContainer class="particles-container absolute inset-0"></div>
    
    
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-gradient-to-br from-orange-500/10 to-transparent rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-gray-700/10 rounded-full blur-3xl animate-pulse-slow delay-1000"></div>
    <div class="absolute top-3/4 left-1/3 w-64 h-64 bg-orange-600/5 rounded-full blur-3xl animate-pulse-slow delay-500"></div>
    
    
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-orange-500/30 to-transparent animate-shine"></div>
    <div class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-gray-500/30 to-transparent animate-shine delay-1000"></div>
  </div>
  
  
  <div class="relative z-10 w-full max-w-lg">
    
    <div class="h-1.5 w-32 mx-auto mb-8 bg-gradient-to-r from-gray-700 via-orange-600 to-gray-700 rounded-full"></div>
    
    
    <div class="bg-gradient-to-br from-gray-900/90 to-gray-950/90 backdrop-blur-2xl rounded-3xl border border-gray-800/50 shadow-2xl overflow-hidden hover:border-gray-700/50 transition-all duration-500 group">
      
      
      <div class="absolute inset-0 bg-gradient-to-br from-orange-600/0 via-orange-600/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
      
      
      <div class="p-8 sm:p-10">
        
        <div class="text-center mb-10 relative">
          
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-32 h-32 border-2 border-gray-800/30 rounded-full animate-spin-slow"></div>
          </div>
          
          
          <div class="relative inline-flex mb-6">
            <div 
              class="w-24 h-24 bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl flex items-center justify-center shadow-2xl relative overflow-hidden"
              [class.animate-float]="floatAnimationState === 1"
            >
              
              <div class="absolute inset-0 bg-gradient-to-br from-orange-600/20 to-transparent blur-xl"></div>
              
              
              <div class="relative z-10">
                <svg class="w-12 h-12 text-orange-500" viewBox="0 0 24 24" fill="none">
                  
                  <path d="M12 2L15 6L21 7L18 11L21 15L15 16L12 20L9 16L3 15L6 11L3 7L9 6L12 2Z" 
                        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
                        class="animate-pulse"/>
                  
                  
                  <path d="M12 8V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="12" cy="12" r="3" fill="currentColor" class="animate-ping-slow"/>
                </svg>
              </div>
              
              
              <div class="absolute inset-0 border-2 border-transparent group-hover:border-orange-500/30 rounded-2xl transition-all duration-500"></div>
            </div>
          </div>
          
          
          <h1 class="text-4xl sm:text-5xl font-black text-white mb-3 tracking-tighter">
            <span class="bg-gradient-to-r from-gray-300 via-orange-500 to-gray-300 bg-clip-text text-transparent bg-300% animate-gradient">
              EduConnect
            </span>
          </h1>
          
          <p class="text-gray-400 font-medium mb-4">
            AI-Powered Learning Intelligence
          </p>
          
          
          <div class="inline-flex items-center gap-3 px-4 py-2.5 bg-gray-900/50 backdrop-blur-sm rounded-full border border-gray-800/50">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 bg-gradient-to-r from-green-500 to-emerald-400 rounded-full animate-pulse"></div>
              <span class="text-sm font-semibold text-gray-300">Neural Core Active</span>
            </div>
            <div class="w-px h-4 bg-gray-700"></div>
            <span class="text-xs text-orange-400 font-bold tracking-wider">v2.1</span>
          </div>
        </div>
        
        
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-3">
              <div class="flex items-center gap-2">
                <div class="p-1.5 bg-gray-900/50 rounded-lg">
                  <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
                <span>Academic Email</span>
              </div>
            </label>
            <div class="relative" [class.input-focused]="activeInput === 'email'">
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                (focus)="onInputFocus('email')"
                (blur)="onInputBlur()"
                placeholder="student@university.edu"
                class="w-full px-5 py-4 pl-14 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-orange-500/50 transition-all duration-300"
                required
              >
              <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </div>
              
              <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-orange-500 to-transparent transition-all duration-500 group-hover:w-full"></div>
            </div>
          </div>
          
          
<div>
  <label class="block text-sm font-semibold text-gray-300 mb-3">
    <div class="flex items-center gap-2">
      <div class="p-1.5 bg-gray-900/50 rounded-lg">
        <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <span>Secure Password</span>
    </div>
  </label>
  <div class="relative" [class.input-focused]="activeInput === 'password'">
    <input
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      name="password"
      (focus)="onInputFocus('password')"
      (blur)="onInputBlur()"
      placeholder="••••••••"
      class="w-full px-5 py-4 pl-14 pr-12 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-orange-500/50 transition-all duration-300"
      required
    >
    <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    
    
    <button
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-orange-500 transition-colors duration-300 z-10"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        
        <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
       </svg>
    </button>
    
    
    <div class="absolute -bottom-2 left-0 right-0 h-0.5 bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 opacity-30"></div>
  </div>
</div>
          
          
          <div class="flex items-center justify-between">
            <label class="flex items-center cursor-pointer group">
              <div class="relative">
                <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="sr-only">
                <div class="w-5 h-5 bg-gray-900/50 border-2 border-gray-700 rounded flex items-center justify-center transition-all duration-300 group-hover:border-orange-500/50">
                  <svg *ngIf="rememberMe" class="w-3 h-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
              </div>
              <span class="ml-3 text-sm text-gray-400 group-hover:text-gray-300 transition-colors">Remember session</span>
            </label>
            
            <button
              type="button"
              (click)="showToast('Password reset feature coming soon!', 'info')"
              class="text-sm font-medium text-gray-400 hover:text-orange-400 transition-all hover:scale-105"
            >
              Forgot password?
            </button>
          </div>
          
          
          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full py-4 px-6 bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800 text-white font-bold rounded-xl hover:from-gray-700 hover:to-gray-800 transition-all duration-500 shadow-2xl hover:shadow-orange-500/20 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
          >
            
            <div class="absolute inset-0 bg-gradient-to-r from-orange-600/0 via-orange-600/20 to-orange-600/0 animate-shimmer"></div>
            
            
            <span class="relative flex items-center justify-center gap-3">
              <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
              </svg>
              
              <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              
              <span class="text-base">
                {{ isLoading ? 'Initializing Neural Network...' : 'Access Neural Interface' }}
              </span>
              
              
              <svg class="w-5 h-5 opacity-0 group-hover:opacity-100 transition-all duration-300 transform -translate-x-2 group-hover:translate-x-0">
                <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </span>
          </button>
        </form>
        
        
        <div class="my-8 relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-800/50"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-gray-900/90 text-gray-500 font-medium">Or continue with</span>
          </div>
        </div>
        
        
        <div class="grid grid-cols-3 gap-3">
          <button
            (click)="loginWithGoogle()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-orange-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-red-500 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">Google</span>
            </div>
          </button>
          
          <button
            (click)="loginWithMicrosoft()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-blue-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-blue-500 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">Microsoft</span>
            </div>
          </button>
          
          <button
            (click)="loginWithGitHub()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-gray-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-gray-300 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">GitHub</span>
            </div>
          </button>
        </div>
        
        
        <div class="mt-8 text-center">
          <p class="text-gray-500 text-sm">
            New to EduConnect? 
            <a routerLink="/register" class="font-semibold text-orange-500 hover:text-orange-400 transition-all hover:underline ml-1">
              Create account
            </a>
          </p>
          <p class="text-xs text-gray-600 mt-2">
            By continuing, you agree to our 
            <a href="#" class="text-gray-500 hover:text-gray-400">Terms</a> 
            and 
            <a href="#" class="text-gray-500 hover:text-gray-400">Privacy Policy</a>
          </p>
        </div>
      </div>
      
      
      <div class="px-8 py-5 border-t border-gray-800/30 bg-gradient-to-t from-gray-950/50 to-transparent">
        <div class="flex items-center justify-between text-xs text-gray-500">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-gradient-to-r from-orange-500 to-yellow-500 rounded-full animate-pulse"></div>
            <span>© 2024 EduConnect AI</span>
          </div>
          <div class="flex items-center gap-4">
            <a href="#" class="hover:text-gray-300 transition">Support</a>
            <a href="#" class="hover:text-gray-300 transition">Docs</a>
            <a href="#" class="hover:text-gray-300 transition">Status</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
