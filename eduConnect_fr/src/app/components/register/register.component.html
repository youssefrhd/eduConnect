
<div class="min-h-screen bg-gradient-to-br from-gray-950 via-black to-gray-900 flex items-center justify-center p-4 relative overflow-hidden">
  
  
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-grid opacity-5"></div>
    
    
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-gradient-to-br from-blue-500/10 to-transparent rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-purple-700/10 rounded-full blur-3xl animate-pulse-slow delay-1000"></div>
    <div class="absolute top-3/4 left-1/3 w-64 h-64 bg-cyan-600/5 rounded-full blur-3xl animate-pulse-slow delay-500"></div>
    
    
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-blue-500/30 to-transparent animate-shine"></div>
  </div>
  
  
  <div class="relative z-10 w-full max-w-2xl">
    
    <div class="h-1.5 w-32 mx-auto mb-8 bg-gradient-to-r from-gray-700 via-blue-600 to-gray-700 rounded-full"></div>
    
    
    <div class="bg-gradient-to-br from-gray-900/90 to-gray-950/90 backdrop-blur-2xl rounded-3xl border border-gray-800/50 shadow-2xl overflow-hidden hover:border-gray-700/50 transition-all duration-500 group">
      
      
      <div class="absolute inset-0 bg-gradient-to-br from-blue-600/0 via-blue-600/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
      
      
      <div class="p-8 sm:p-10">
        
        <div class="text-center mb-8">
          <div class="relative inline-flex mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl flex items-center justify-center shadow-2xl relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-br from-blue-600/20 to-transparent blur-xl"></div>
              
              <div class="relative z-10">
                <svg class="w-10 h-10 text-blue-500" viewBox="0 0 24 24" fill="none">
                  <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z" 
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M6 1v3M10 1v3M14 1v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="12" cy="13" r="3" fill="currentColor" class="animate-pulse-slow"/>
                </svg>
              </div>
            </div>
          </div>
          
          <h1 class="text-4xl sm:text-5xl font-black text-white mb-3">
            <span class="bg-gradient-to-r from-gray-300 via-blue-500 to-gray-300 bg-clip-text text-transparent bg-300% animate-gradient">
              Create Account
            </span>
          </h1>
          <p class="text-gray-400 font-medium">
            Join the AI-Powered Learning Revolution
          </p>
        </div>
        
        
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-6"> 
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-3">
                <div class="flex items-center gap-2">
                  <div class="p-1.5 bg-gray-900/50 rounded-lg">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <span>First Name</span>
                </div>
              </label>
              <div class="relative" [class.input-focused]="activeInput === 'firstName'">
                <input
                  type="text"
                  [(ngModel)]="firstName"
                  name="firstName"
                  (focus)="onInputFocus('firstName')"
                  (blur)="onInputBlur()"
                  placeholder="John"
                  class="w-full px-5 py-4 pl-14 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                  required
                >
                <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                  <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
              </div>
            </div>
            
            
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-3">
                <div class="flex items-center gap-2">
                  <div class="p-1.5 bg-gray-900/50 rounded-lg">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <span>Last Name</span>
                </div>
              </label>
              <div class="relative" [class.input-focused]="activeInput === 'lastName'">
                <input
                  type="text"
                  [(ngModel)]="lastName"
                  name="lastName"
                  (focus)="onInputFocus('lastName')"
                  (blur)="onInputBlur()"
                  placeholder="Doe"
                  class="w-full px-5 py-4 pl-14 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                  required
                >
                <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                  <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>
          
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-3">
              <div class="flex items-center gap-2">
                <div class="p-1.5 bg-gray-900/50 rounded-lg">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                  </svg>
                </div>
                <span>Academic Email</span>
              </div>
            </label>
            <div class="relative" [class.input-focused]="activeInput === 'email'">
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                (focus)="onInputFocus('email')"
                (blur)="onInputBlur()"
                placeholder="student@university.edu"
                class="w-full px-5 py-4 pl-14 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                required
              >
              <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </div>
            </div>
          </div>
          
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-3">
              <div class="flex items-center gap-2">
                <div class="p-1.5 bg-gray-900/50 rounded-lg">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                </div>
                <span>Date of Birth</span>
              </div>
            </label>
            <div class="relative" [class.input-focused]="activeInput === 'birthday'">
              <input
                type="date"
                [(ngModel)]="birthday"
                name="birthday"
                (focus)="onInputFocus('birthday')"
                (blur)="onInputBlur()"
                class="w-full px-5 py-4 pl-14 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                required
              >
              <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
            </div>
          </div>
          
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-3">
              <div class="flex items-center gap-2">
                <div class="p-1.5 bg-gray-900/50 rounded-lg">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </div>
                <span>Password</span>
              </div>
            </label>
            <div class="relative" [class.input-focused]="activeInput === 'password'">
              <input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                (focus)="onInputFocus('password')"
                (blur)="onInputBlur()"
                placeholder="••••••••"
                class="w-full px-5 py-4 pl-14 pr-12 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                required
              >
              <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-500 transition-colors duration-300"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  <path *ngIf="showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.59 6.59m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
          </div>
          
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-3">
              <div class="flex items-center gap-2">
                <div class="p-1.5 bg-gray-900/50 rounded-lg">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                </div>
                <span>Confirm Password</span>
              </div>
            </label>
            <div class="relative" [class.input-focused]="activeInput === 'confirmPassword'">
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                (focus)="onInputFocus('confirmPassword')"
                (blur)="onInputBlur()"
                placeholder="••••••••"
                class="w-full px-5 py-4 pl-14 pr-12 bg-gray-900/30 border-2 border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                required
              >
              <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
              </div>
              <button
                type="button"
                (click)="toggleConfirmPasswordVisibility()"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-500 transition-colors duration-300" 
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path *ngIf="!showConfirmPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  <path *ngIf="showConfirmPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.59 6.59m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
          </div>
          
          
<div class="flex items-start">
  <div class="flex items-center h-5">
    <div class="relative">
      <input
        id="terms"
        type="checkbox"
        [(ngModel)]="acceptTerms"
        name="acceptTerms"
        class="absolute w-4 h-4 opacity-0 cursor-pointer" 
      >
      <div 
        class="w-5 h-5 bg-gray-900/50 border-2 border-gray-700 rounded flex items-center justify-center transition-all duration-300 group hover:border-blue-500/50 cursor-pointer"
        [class.border-blue-500]="acceptTerms"
        [class.bg-blue-500]="acceptTerms"
        (click)="toggleTerms()"
      >
        <svg *ngIf="acceptTerms" class="w-3 h-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
    </div>
  </div>
  <label for="terms" class="ml-3 text-sm text-gray-400 cursor-pointer">
    I agree to the 
    <a href="#" class="text-blue-500 hover:text-blue-400 font-medium">Terms of Service</a> 
    and 
    <a href="#" class="text-blue-500 hover:text-blue-400 font-medium">Privacy Policy</a>. 
    I confirm that I am at least 13 years old.
  </label>
</div>
          
          
          <div class="p-4 bg-gray-900/30 rounded-xl border border-gray-800/50">
            <p class="text-sm font-medium text-gray-300 mb-2">Password Requirements:</p>
            <ul class="text-xs text-gray-400 space-y-1">
              <li class="flex items-center gap-2">
                <span [class.text-green-500]="password.length >= 8" class="text-gray-500">●</span>
                At least 8 characters
              </li>
              <li class="flex items-center gap-2">
                <span [class.text-green-500]="hasUppercase(password)" class="text-gray-500">●</span>
                One uppercase letter
              </li>
              <li class="flex items-center gap-2">
                <span [class.text-green-500]="hasNumber(password)" class="text-gray-500">●</span>
                One number
              </li>
              <li class="flex items-center gap-2">
                <span [class.text-green-500]="hasSpecialChar(password)" class="text-gray-500">●</span>
                One special character
              </li>
            </ul>
          </div>
          
          
          <button
            type="submit"
            [disabled]="isLoading || registerForm.invalid"
            class="w-full py-4 px-6 bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800 text-white font-bold rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all duration-500 shadow-2xl hover:shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
          >
            <div class="absolute inset-0 bg-gradient-to-r from-blue-600/0 via-blue-600/20 to-blue-600/0 animate-shimmer"></div>
            
            <span class="relative flex items-center justify-center gap-3">
              <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
              </svg>
              
              <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              
              <span class="text-base">
                {{ isLoading ? 'Creating Account...' : 'Create Neural Profile' }}
              </span>
            </span>
          </button>
        </form>
        
        
        <div class="my-8 relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-800/50"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-gray-900/90 text-gray-500 font-medium">Or sign up with</span>
          </div>
        </div>
        
        
        <div class="grid grid-cols-3 gap-3">
          <button
            (click)="signUpWithGoogle()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-red-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-red-500 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">Google</span>
            </div>
          </button>
          
          <button
            (click)="signUpWithMicrosoft()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-blue-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-blue-500 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">Microsoft</span>
            </div>
          </button>
          
          <button
            (click)="signUpWithGitHub()"
            class="p-3.5 bg-gray-900/30 border border-gray-800/50 rounded-xl hover:border-gray-500/30 hover:bg-gray-800/30 transition-all duration-300 group hover:scale-105"
          >
            <div class="flex flex-col items-center gap-2">
              <svg class="w-6 h-6 text-gray-300 group-hover:scale-110 transition-transform">
                <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              <span class="text-xs text-gray-400 group-hover:text-gray-300">GitHub</span>
            </div>
          </button>
        </div>
        
        
        <div class="mt-8 text-center">
