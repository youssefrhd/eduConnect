
<div class="min-h-screen bg-gray-950 text-gray-200 flex items-center justify-center p-6">

  <div class="w-full max-w-6xl grid lg:grid-cols-3 gap-8">

    <div class="bg-gray-900 rounded-2xl shadow-xl p-6 flex flex-col items-center border border-gray-800">

      <div class="relative group">
        <img
          [src]="preview"
          class="w-36 h-36 rounded-full object-cover border-4 border-orange-500 shadow-lg"
        />

        <label
          class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer"
        >
          <span class="text-sm">Change</span>
          <input type="file" hidden (change)="onFileSelected($event)" />
        </label>
      </div>

      <h2 class="mt-4 text-xl font-semibold text-orange-400">{{user.name}}</h2>
      <p class="text-gray-400 text-sm">{{user.email}}</p>

      <div class="mt-6 w-full space-y-3 text-sm">

        <div class="flex justify-between bg-gray-800 p-3 rounded-xl">
          <span class="text-gray-400">Projects</span>
          <span class="font-semibold">24</span>
        </div>

        <div class="flex justify-between bg-gray-800 p-3 rounded-xl">
          <span class="text-gray-400">Followers</span>
          <span class="font-semibold">1.2k</span>
        </div>

        <div class="flex justify-between bg-gray-800 p-3 rounded-xl">
          <span class="text-gray-400">Following</span>
          <span class="font-semibold">180</span>
        </div>

      </div>

    </div>


    <div class="lg:col-span-2 space-y-8">

      <div class="bg-gray-900 rounded-2xl shadow-xl border border-gray-800 p-8">

        <h1 class="text-3xl font-bold text-orange-400 mb-8">Profile Settings</h1>

        <div class="grid md:grid-cols-2 gap-6">

          <div>
            <label class="text-sm text-gray-400">Full Name</label>
            <input
              [(ngModel)]="user.name"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Email</label>
            <input
              [(ngModel)]="user.email"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Phone Number</label>
            <input
              [(ngModel)]="user.phone"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Birthday</label>
            <input
              type="date"
              [(ngModel)]="user.birthday"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Location</label>
            <input
              [(ngModel)]="user.location"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Website</label>
            <input
              [(ngModel)]="user.website"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

        </div>

        <div class="mt-6">
          <label class="text-sm text-gray-400">Bio</label>
          <textarea
            rows="4"
            [(ngModel)]="user.bio"
            class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
          ></textarea>
        </div>

        <div class="flex justify-end mt-8">
          <button
            (click)="save()"
            class="bg-orange-500 hover:bg-orange-400 transition px-8 py-3 rounded-xl font-semibold shadow-lg"
          >
            Save Profile
          </button>
        </div>

      </div>


      <div class="bg-gray-900 rounded-2xl shadow-xl border border-gray-800 p-8">

        <h2 class="text-2xl font-bold text-orange-400 mb-6">Security</h2>

        <div class="grid md:grid-cols-3 gap-6">

          <div>
            <label class="text-sm text-gray-400">Current Password</label>
            <input
              type="password"
              [(ngModel)]="password.current"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">New Password</label>
            <input
              type="password"
              [(ngModel)]="password.new"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-400">Confirm Password</label>
            <input
              type="password"
              [(ngModel)]="password.confirm"
              class="mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-orange-500 outline-none"
            />
          </div>

        </div>

        <div class="flex justify-end mt-8">
          <button
            (click)="resetPassword()"
            class="bg-orange-500 hover:bg-orange-400 transition px-8 py-3 rounded-xl font-semibold shadow-lg"
          >
            Update Password
          </button>
        </div>

      </div>

    </div>

  </div>

</div>
